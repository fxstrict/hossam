<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>غير متصل — Hossam License Manager Pro</title>
<style>
  body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0D1B2A; color: #F8F5EF; height: 100vh; margin: 0; display: flex; align-items: center; justify-content: center; text-align: center; }
  .box { max-width: 380px; padding: 24px; }
  .mark { width: 64px; height: 64px; border-radius: 16px; background: linear-gradient(135deg, #E8C97A, #9B7A1E); color: #0D1B2A; font-weight: 800; font-size: 28px; display: flex; align-items: center; justify-content: center; margin: 0 auto 18px; }
  h1 { font-size: 18px; margin-bottom: 8px; }
  p { color: #C9CED9; font-size: 13.5px; line-height: 1.7; }
  button { margin-top: 16px; padding: 10px 20px; border-radius: 10px; border: none; background: linear-gradient(135deg, #E8C97A, #C9A84C); color: #0D1B2A; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
  <div class="box">
    <div class="mark">H</div>
    <h1>لا يوجد اتصال بالإنترنت حاليًا</h1>
    <p>هذا التطبيق يعمل محليًا بالكامل ولا يحتاج إنترنت لإدارة بياناتك، لكن الصفحة التي طلبتها لم تُحفظ بعد في ذاكرة التخزين المؤقت لهذا الجهاز. أعد الاتصال مرة واحدة على الأقل لتحميل التطبيق كاملًا، ثم سيعمل دون اتصال بعدها.</p>
    <button onclick="location.reload()">إعادة المحاولة</button>
  </div>
</body>
</html>
